<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ZFS Encrypt Migrate logo</title>
  <desc id="desc">A stack of dataset disks next to a padlock; a block of data slides from the stack into the lock, which then closes.</desc>
  <defs>
    <linearGradient id="background" x1="96" y1="64" x2="416" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#102a43" />
      <stop offset="1" stop-color="#07111f" />
    </linearGradient>
    <linearGradient id="body" x1="270" y1="250" x2="430" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="stack" x1="82" y1="212" x2="202" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2dd4bf" />
      <stop offset="1" stop-color="#2563eb" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020617" flood-opacity="0.32" />
    </filter>
    <style>
      #static-shackle {
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        #animated-shackle,
        #packet,
        #lock-glow {
          display: none;
        }

        #static-shackle {
          display: inline;
        }
      }
    </style>
  </defs>

  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#background)" />
  <rect x="42" y="42" width="428" height="428" rx="96" fill="none" stroke="#1e3a5f" stroke-width="4" />

  <g filter="url(#soft-shadow)">
    <path d="M82 212V372A60 20 0 0 0 202 372V212Z" fill="url(#stack)" />
    <path d="M82 265A60 20 0 0 0 202 265M82 318A60 20 0 0 0 202 318" fill="none" stroke="#ccfbf1" stroke-opacity="0.45" stroke-width="4" />
    <ellipse cx="142" cy="212" rx="60" ry="20" fill="#5eead4" />
    <ellipse cx="142" cy="212" rx="60" ry="20" fill="none" stroke="#d5f9f3" stroke-width="4" />

    <g fill="none" stroke="#5eead4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M216 296l14 14-14 14" />
      <path d="M240 296l14 14-14 14" stroke-opacity="0.55" />
    </g>

    <rect id="packet" x="186" y="300" width="24" height="20" rx="6" fill="#d5f9f3" opacity="0">
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="6s"
        values="0 0; 0 0; 104 0; 104 0"
        keyTimes="0; 0.1; 0.4; 1"
        repeatCount="indefinite"
      />
      <animate
        attributeName="opacity"
        dur="6s"
        values="0; 0; 1; 1; 0; 0"
        keyTimes="0; 0.1; 0.16; 0.34; 0.4; 1"
        repeatCount="indefinite"
      />
    </rect>

    <g id="animated-shackle" fill="none" stroke-linecap="round">
      <animateTransform
        attributeName="transform"
        type="translate"
        dur="6s"
        values="0 -26; 0 -26; 0 0; 0 0; 0 -26"
        keyTimes="0; 0.42; 0.52; 0.86; 1"
        repeatCount="indefinite"
      />
      <path d="M295 274V206C295 170 320 150 350 150S405 170 405 206V258" stroke="#d5f9f3" stroke-width="28" />
      <path d="M295 274V206C295 170 320 150 350 150S405 170 405 206V258" stroke="#5eead4" stroke-width="10" />
    </g>
    <g id="static-shackle" fill="none" stroke-linecap="round">
      <path d="M295 264V206C295 170 320 150 350 150S405 170 405 206V264" stroke="#d5f9f3" stroke-width="28" />
      <path d="M295 264V206C295 170 320 150 350 150S405 170 405 206V264" stroke="#5eead4" stroke-width="10" />
    </g>

    <rect x="270" y="250" width="160" height="142" rx="34" fill="url(#body)" />
    <rect x="280" y="260" width="140" height="122" rx="26" fill="none" stroke="#ccfbf1" stroke-opacity="0.28" stroke-width="4" />

    <circle id="lock-glow" cx="350" cy="318" r="40" fill="#5eead4" opacity="0">
      <animate
        attributeName="opacity"
        dur="6s"
        values="0; 0; 0.22; 0.22; 0; 0"
        keyTimes="0; 0.5; 0.58; 0.76; 0.86; 1"
        repeatCount="indefinite"
      />
    </circle>
    <circle cx="350" cy="310" r="18" fill="#07111f" />
    <path d="M350 324V352" stroke="#07111f" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
